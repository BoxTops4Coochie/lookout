name: Lookout
options:
  bundleIdPrefix: com.aabduh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: "148.0.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "20"
targets:
  Lookout:
    type: application
    platform: iOS
    sources:
      - Lookout
    dependencies:
      - sdk: WebKit.framework
      - package: WebRTC
    settings:
      base:
        INFOPLIST_FILE: Lookout/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aabduh.lookout
        PRODUCT_NAME: Lookout
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
